# Five instances of the same Heimdall image, one per role in the credential exchange.
# They differ only by published port and by which files the bootstrap uploads into them.
services:

  # Certificate authority: the root of trust, issues the issuer's own credential.
  heimdall-ca: &heimdall
    container_name: heimdall-ca
    build: .
    ports:
      - 8081:8080
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 10s
      timeout: 50s
      retries: 3
      start_period: 10s
#    volumes:
#      - logs-ca:/app/execution
#      - ./circom:/app/circom
#    working_dir: /app/circom
#    command: bash -c "npm i && bash"
#    tty: true
    networks:
      - heimdall-network

  # Issues the customer's credential, holding the attributes to be proven later.
  heimdall-issuer:
    <<: *heimdall
    container_name: heimdall-issuer
    ports:
      - 8082:8080
#    volumes:
#      - logs-issuer:/app/execution
    networks:
      - heimdall-network

  # The customer's side: keeps the credential and builds proofs from it.
  heimdall-holder:
    <<: *heimdall
    container_name: heimdall-holder
    ports:
      - 8083:8080
#    volumes:
#      - logs-holder:/app/execution
    networks:
      - heimdall-network

  # The shop's verifier: checks proofs against the issuer's public key.
  heimdall-verifier:
    <<: *heimdall
    container_name: heimdall-verifier
    ports:
      - 8084:8080
#    volumes:
#      - logs-verifier:/app/execution
    networks:
      - heimdall-network

  # The delivery service's own verifier, so it does not have to trust the shop's result.
  heimdall-verifier-delivery:
    <<: *heimdall
    container_name: heimdall-verifier-delivery
    ports:
      - 8085:8080
    networks:
      - heimdall-network

  # One-shot job that wires the demo together once every instance is up: generates the
  # keys, has the CA certify the issuer, issues the customer's credential, and uploads
  # the issuer's public key into both verifiers. Exits when done.
  bootstrap:
    container_name: bootstrap
    build:
      dockerfile: bootstrap.Dockerfile
    env_file: .env
    depends_on:
      heimdall-ca:
        condition: service_healthy
      heimdall-issuer:
        condition: service_healthy
      heimdall-holder:
        condition: service_healthy
      heimdall-verifier:
        condition: service_healthy
#    volumes:
#      - logs-bootstrap:/app/execution
    networks:
      - heimdall-network

#volumes:
